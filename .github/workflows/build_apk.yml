name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # The project lives in the astrowizard_kundli/ folder of the repo.
    defaults:
      run:
        working-directory: astrowizard_kundli
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The android/ runner is generated here, so the repo only holds our code.
      - name: Generate Android runner
        run: |
          flutter create --platforms=android --project-name astrowizard_kundli --org in.co.astrowizard .
          rm -f test/widget_test.dart

      - name: App name
        run: sed -i 's/android:label="[^"]*"/android:label="AstroWizard Kundali Software"/' android/app/src/main/AndroidManifest.xml

      - name: Location permission
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "INTERNET\|LOCATION" android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      # Writes its own icon config, so it works even if pubspec.yaml has none.
      - name: Launcher icon
        run: |
          flutter pub add --dev flutter_launcher_icons
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: "launcher_icon"
            ios: false
            image_path: "assets/icon/icon.png"
            adaptive_icon_background: "#F4EFE4"
            adaptive_icon_foreground: "assets/icon/icon_fg.png"
            min_sdk_android: 21
          EOF
          dart run flutter_launcher_icons

      # Tests report problems but never stop the APK from being built.
      - name: Run tests
        run: flutter test
        continue-on-error: true

      # The sweph plugin is compiled against Android 31, but its androidx
      # dependencies need 34+. This init script raises compileSdk for every module.
      - name: Raise compileSdk for plugins
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compile_sdk.gradle <<'EOF'
          allprojects {
            afterEvaluate { p ->
              if (p.hasProperty('android')) {
                try {
                  p.android.compileSdk = 36
                } catch (Throwable e) {
                  p.android.compileSdkVersion(36)
                }
              }
            }
          }
          EOF

      - name: Build APK
        env:
          AW_SECRET: ${{ secrets.AW_SECRET }}
        run: flutter build apk --release --dart-define=AW_SECRET="$AW_SECRET"

      - uses: actions/upload-artifact@v4
        with:
          name: astrowizard-kundli-apk
          path: astrowizard_kundli/build/app/outputs/flutter-apk/app-release.apk

  # Windows 10/11 (64-bit) desktop builds: paid (payment wall on) and free (wall off).
  windows:
    strategy:
      matrix:
        edition: [paid, free]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: astrowizard_kundli
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner
        run: |
          flutter create --platforms=windows --project-name astrowizard_kundli --org in.co.astrowizard .
          rm -f test/widget_test.dart
          sed -i 's/L"astrowizard_kundli"/L"AstroWizard Kundali Software"/' windows/runner/main.cpp

      - name: Get packages
        run: flutter pub get

      - name: Windows icon
        run: |
          flutter pub add --dev flutter_launcher_icons
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: false
            ios: false
            image_path: "assets/icon/icon.png"
            windows:
              generate: true
              image_path: "assets/icon/icon.png"
              icon_size: 256
          EOF
          dart run flutter_launcher_icons
        continue-on-error: true

      - name: Build Windows (${{ matrix.edition }})
        env:
          AW_SECRET: ${{ secrets.AW_SECRET }}
        run: |
          if [ "${{ matrix.edition }}" = "free" ]; then
            flutter build windows --release --dart-define=PAYWALL=off
          else
            flutter build windows --release --dart-define=AW_SECRET="$AW_SECRET"
          fi

      # App-local copy of the Visual C++ runtime, so it also starts on PCs without it.
      - name: Add VC++ runtime DLLs
        run: |
          for f in msvcp140 vcruntime140 vcruntime140_1; do
            cp "/c/Windows/System32/$f.dll" build/windows/x64/runner/Release/ || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: astrowizard-kundli-windows-portable-${{ matrix.edition }}
          path: astrowizard_kundli/build/windows/x64/runner/Release

      - name: Build installer (single Setup.exe)
        run: |
          choco install innosetup -y --no-progress
          MSYS_NO_PATHCONV=1 "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DOutName=AstroWizardKundaliSetup-${{ matrix.edition }}" tools/installer.iss
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: astrowizard-kundli-windows-installer-${{ matrix.edition }}
          path: astrowizard_kundli/installer_out/AstroWizardKundaliSetup-${{ matrix.edition }}.exe
          if-no-files-found: warn
