name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The android/ runner is generated here, so the repo only holds our code.
      - name: Generate Android runner
        run: flutter create --platforms=android --project-name astrowizard_kundli --org in.co.astrowizard .
      - name: App name
        run: sed -i 's/android:label="[^"]*"/android:label="AstroWizard Kundali Software"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Launcher icon
        run: dart run flutter_launcher_icons
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: astrowizard-kundli-apk
          path: build/app/outputs/flutter-apk/app-release.apk
