name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The android/ runner is generated here, so the repo only holds our code.
      - name: Generate Android runner
        run: flutter create --platforms=android --project-name astrowizard_kundli --org in.co.astrowizard .

      - name: App name
        run: sed -i 's/android:label="[^"]*"/android:label="AstroWizard Kundali Software"/' android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      # Adds the package if pubspec.yaml does not list it, then makes the icons.
      - name: Launcher icon
        run: |
          flutter pub add --dev flutter_launcher_icons
          dart run flutter_launcher_icons

      # Tests report problems but never stop the APK from being built.
      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: astrowizard-kundli-apk
          path: build/app/outputs/flutter-apk/app-release.apk
